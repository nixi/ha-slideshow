show_file:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    file:
      required: true
      example: image.jpg
      selector:
        text:
    length:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    wait:
      selector:
        boolean:
    audio_track_id:
      selector:
        text:
    subtitle_track_id:
      selector:
        text:
    zone_id:
      selector:
        text:
    zone_name:
      selector:
        text:

show_html:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    html:
      required: true
      example: "<h1>Dinner is ready</h1>"
      selector:
        text:
          multiline: true
    length:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    zone_id:
      selector:
        text:
    zone_name:
      selector:
        text:

show_stream:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    url:
      required: true
      example: rtsp://192.168.1.50/stream
      selector:
        text:
    length:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    zone_id:
      selector:
        text:
    zone_name:
      selector:
        text:

set_playlist:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    playlist_id:
      selector:
        number:
          min: 1
          mode: box
    playlist_name:
      selector:
        text:
    playlist_number:
      selector:
        number:
          min: 1
          mode: box
    length:
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    zone_id:
      selector:
        text:
    zone_name:
      selector:
        text:

set_layout:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    layout_id:
      selector:
        number:
          min: 1
          mode: box
    layout_name:
      example: Default layout
      selector:
        text:
    length:
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    permanent:
      default: false
      selector:
        boolean:

show_camera:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    camera_entity_id:
      required: true
      example: camera.front_door
      selector:
        entity:
          domain: camera
    duration:
      default: 60
      selector:
        number:
          min: 1
          max: 86400
          unit_of_measurement: s
          mode: box
    zone_id:
      selector:
        text:
    zone_name:
      selector:
        text:

create_content:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    content_name:
      required: true
      example: Holiday photos
      selector:
        text:
    path:
      required: true
      example: photos/holiday
      selector:
        text:
    content_type:
      default: ALPHABETICALLY
      selector:
        select:
          options:
            - ALPHABETICALLY
            - RANDOM
            - STREAM
            - DATE_TIME
            - WEATHER
            - RSS
            - TEXT
            - VIDEO_INPUT
            - YOUTUBE

delete_content:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    content_id:
      required: true
      example: 34
      selector:
        number:
          min: 1
          mode: box

install_panel:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    content_name:
      default: Home Assistant panel
      selector:
        text:
    filename:
      default: ha_panel.url
      selector:
        text:

get_panel_url:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: slideshow

synchronize:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    url:
      required: true
      example: https://example.com/data.zip
      selector:
        text:
    target:
      required: true
      example: downloads
      selector:
        text:
    method:
      default: GET
      selector:
        select:
          options:
            - GET
            - POST
            - PUT
    clear_folder:
      default: false
      selector:
        boolean:

send_key:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    key_code:
      required: true
      example: KEYCODE_ENTER
      selector:
        text:

tap:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    x:
      required: true
      example: 640
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: px
          mode: box
    y:
      required: true
      example: 400
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: px
          mode: box

start_app:
  target:
    entity:
      integration: slideshow
      domain: media_player
  fields:
    package_name:
      required: true
      example: com.android.chrome
      selector:
        text:
